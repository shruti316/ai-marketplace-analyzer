# Render Blueprint configuration for TrustSphere Backend Service
# Deploys the Node.js/Express Backend on Render's Free Web Service tier (₹0 budget).
# Python ML inference is permanently handled by Hugging Face ZeroGPU Space (06Remontada06/trustphere-ml).
services:
  - type: web
    name: ai-marketplace-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /live
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: JWT_SECRET
        generateValue: true
      - key: TRUST_PROXY
        value: "1"
      - key: HF_SPACE_ID
        value: "06Remontada06/trustphere-ml"
      - key: HF_SPACE_URL
        value: "https://06remontada06-trustphere-ml.hf.space"
      - key: HF_TOKEN
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
