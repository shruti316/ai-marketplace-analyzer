# Render Blueprint configuration for AI Marketplace Analyzer Services
# Deploys both the Python AI Engine (Docker runtime with Tesseract OCR) and Node.js/Express Backend
services:
  - type: web
    name: ai-marketplace-python
    env: docker
    dockerfilePath: ./Dockerfile
    plan: standard
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: 8000
      - key: SERVICE_HOST
        value: "0.0.0.0"

  - type: web
    name: ai-marketplace-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    healthCheckPath: /live
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ALLOWED_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000"
      - key: JWT_SECRET
        generateValue: true
      - key: PYTHON_SERVICE_URL
        value: http://ai-marketplace-python:8000
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_SSL
        value: "true"
